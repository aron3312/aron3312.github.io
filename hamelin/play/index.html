<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Hamelin Squeaks</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- What shows while the bundle downloads (a few MB): React replaces #root's contents when it starts.
         The web demo then shows the same screen (game/demo/LoadingScreen.tsx) until its 3D models are in. -->
    <style>
      body { margin: 0; background: #cfe8ee; }
      .boot { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; color: #4a2f1b; }
      .boot-title { font-size: 28px; font-weight: 900; }
      .boot-text { font-size: 16px; font-weight: 700; color: #7a5a3c; }
      .boot-dots { display: flex; gap: 8px; margin-top: 6px; }
      .boot-dots i { width: 10px; height: 10px; border-radius: 5px; background: #f2b632; animation: boot 1.2s infinite ease-in-out; }
      .boot-dots i:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-6px); } }
    </style>
  <link rel="icon" href="/hamelin/play/favicon.ico" /></head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div class="boot">
        <div class="boot-title" id="boot-title">Hamelin Squeaks</div>
        <div class="boot-text" id="boot-text">Loading…</div>
        <div class="boot-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      // The same language rule as game/i18n.ts: Chinese for any Chinese, English otherwise (?lang= forces one).
      (function () {
        var forced = new URLSearchParams(location.search).get('lang');
        var zh = forced === 'zh' || forced === 'en' ? forced === 'zh' : /^zh/i.test(navigator.language || '');
        if (!zh) return;
        document.documentElement.lang = 'zh-Hant';
        document.getElementById('boot-title').textContent = '魔笛鼠鼠回家囉';
        document.getElementById('boot-text').textContent = '載入中…';
      })();
    </script>
  <script src="/hamelin/play/_expo/static/js/web/entry-5ef1bea9a6b176968698c0f2d3a52c25.js" defer></script>
</body>
</html>
